# PacketFeeder Lab — Multi-vhost nginx configuration for vhost scanning (T1595.003)
# Deploy: cp vhosts.conf /etc/nginx/sites-available/default && nginx -t && systemctl reload nginx

# Catch-all — 404 for any unlisted vhost
server {
    listen 80;
    server_name _;

    root /var/www/html/packetfeeder-lab/vhosts;

    location / {
        try_files $uri /default.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# Main app — packetfeeder.lab (also serves direct IP access)
server {
    listen 80 default_server;
    server_name packetfeeder.lab;

    root /var/www/html/packetfeeder-lab;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

